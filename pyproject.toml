[project]
name = "pytest-libfaketime"
version = "0.1.3"
description = "A python-libfaketime plugin for pytest"
authors = [{ name = "Yaal Coop", email = "contact@yaal.coop" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
keywords = ["libfaketime", "unit tests", "mock"]
requires-python = ">=3.10"
classifiers = [
    "Intended Audience :: Developers",
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Environment :: Web Environment",
    "Programming Language :: Python",
    "Operating System :: OS Independent",
    "Framework :: Pytest",
]
dependencies = [
    "pytest>=3.0.0",
    "libfaketime>=2.0.0,<3",
]

[project.urls]
Repository = "https://github.com/pytest-dev/pytest-libfaketime"

[project.entry-points.pytest11]
libfaketime = "pytest_libfaketime"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
test = ["pytest-xdist>=3.5.0,<4"]
dev = [{ include-group = "test" }, "tox>=4.22", "tox-uv>=1.13"]

[tool.ruff.lint]
ignore = ["E501", "E722"]

[tool.tox]
requires = ["tox>=4.22", "tox-uv>=1.13"]
env_list = ["style", "py310", "py311", "py312", "py313", "py314"]

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
dependency_groups = ["test"]
commands = [["pytest", "-n", "auto", { replace = "posargs", extend = true }]]

[tool.tox.env.style]
runner = "uv-venv-runner"
skip_install = true
deps = ["pre-commit-uv"]
commands = [["pre-commit", "run", "--all-files"]]
